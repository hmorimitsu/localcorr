# Build the package (sdist + wheel), install the wheel with pip, then run
# pytest against the installed package instead of the source tree.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.4.2
          python -m pip install --upgrade setuptools==82.0.1 wheel==0.46.3
          python -m pip install --upgrade pytest==9.0.2
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Build and install the wheel
        run: |
          python -m build
          python -m pip install dist/*.whl
      - name: Test the installed wheel
        # The repository root is itself the localcorr package directory,
        # and tests/conftest.py prepends the checkout's parent to
        # sys.path, so running pytest inside the checkout would import
        # the sources instead of the installed wheel. Copy the tests to
        # a neutral directory and run them from there.
        run: |
          testdir="$(mktemp -d)/wheel-tests"
          mkdir -p "$testdir"
          cp -r tests "$testdir/"
          cd "$testdir"
          python -m pytest tests/
